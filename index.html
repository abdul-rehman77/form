<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Form</title>

<style>
  body {
    font-family: Arial;
    margin: 0;
    padding: 20px;
    background:linear-gradient(135deg,skyblue,rgb(250, 128, 128),rgb(111, 111, 209))
  }
 .logo
  {
    display:flex;
    align-items: center;
  }
  .logo img{
    width: 30px ;
    height: 30px;
    padding: 10px;
    
  }
  .form-container{
    text-align: center;
  }

  .form-container {
    max-width: 500px;
    margin: auto;
    background: white;
   
    border-radius: 10px;
  }
  #button:hover
  {
background-color:gray;
  }

  input, textarea, button {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    border: 1px solid #ccc;
    border-radius: 5px;
  }

  button {
    background: #007bff;
    color: white;
    border: none;
  }

  
  @media (max-width: 600px) {
    .form-container {
      padding: 15px;
    }
  }
  .form-container
  {

    padding: 20px;
  }
</style>
</head>

<body>
  <div class="logo">
  <img src="logo.jfif"class="logo"alt="Logo"><span>my first form</span></div>

<div class="form-container">
  <h2>Contact Form</h2>
  
  <input type="text" placeholder="Your Name">
  <input type="email" placeholder="Your Email">
  <textarea rows="4" placeholder="Your Message"></textarea>
  
  <button id="button">Submit</button>
</div>

</body>
</html>
